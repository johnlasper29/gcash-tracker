<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bank Accounts Dashboard</title>
    <!-- Custom App Icons -->
    <link rel="apple-touch-icon" href="https://johnlasper29.github.io/funds-tracker/logo.png">
    <link rel="icon" type="image/png" href="https://johnlasper29.github.io/funds-tracker/logo.png">
    <link rel="manifest" href="manifest.json">

    <!-- Google Font: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #070a0f;
            color: #f3f4f6;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Pattern Lock Screen Overlay */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #070a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }
        .lock-container {
            width: 100%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .welcome-user-text {
            font-size: 20px;
            font-weight: 700;
            color: #34d399;
            letter-spacing: -0.3px;
        }
        .lock-title {
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .pattern-grid {
            position: relative;
            width: 320px;
            height: 320px;
            background: #0f172a;
            border: 1px solid #1f2937;
            border-radius: 28px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 28px;
            touch-action: none;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
        }
        .pattern-dot {
            width: 20px;
            height: 20px;
            background: #334155;
            border-radius: 50%;
            margin: auto;
            position: relative;
            transition: transform 0.2s, background 0.2s;
            pointer-events: none;
        }
        .pattern-dot.active {
            background: #059669;
            transform: scale(1.6);
            box-shadow: 0 0 16px rgba(5, 150, 105, 0.8);
        }
        #pattern-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .lock-error {
            color: #f87171;
            font-size: 13px;
            min-height: 18px;
        }
        .pattern-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        /* Main App Container */
        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        /* App Header / Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .balance-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #059669, #0284c7);
        }
        .balance-title {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            color: #34d399;
            letter-spacing: -0.5px;
        }

        /* Accounts List Container */
        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Individual Account Item Card */
        .row-item {
            display: grid;
            grid-template-columns: 1fr 130px 36px;
            align-items: center;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 10px 14px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .row-item:hover {
            border-color: #334155;
        }

        /* Left Side: Brand/Name Wrapper */
        .name-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #334155;
            padding-left: 10px;
            height: 36px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .brand-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .brand-icon svg {
            width: 100%;
            height: 100%;
            transition: fill 0.3s ease;
        }

        .input-name {
            width: 100%;
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }
        .input-name::placeholder {
            color: #475569;
        }

        /* Right Side: Amount Input */
        .input-amount {
            width: 100%;
            background: transparent;
            border: none;
            color: #f3f4f6;
            font-size: 17px;
            font-weight: 600;
            text-align: right;
            padding: 8px 4px;
            outline: none;
            transition: color 0.2s ease;
        }
        .input-amount:focus {
            color: #34d399;
        }
        .input-amount::placeholder {
            color: #334155;
        }

        /* Delete Row Button */
        .btn-delete-row {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            width: 32px;
            border-radius: 6px;
            transition: all 0.2s;
            margin-left: 4px;
        }
        .btn-delete-row:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Bottom Action Button Area */
        .actions-area {
            display: flex;
            width: 100%;
            max-width: 440px;
            gap: 10px;
        }
        .btn-action {
            flex: 1;
            background: #059669;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            background: #10b981;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid #334155;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #334155;
        }
    </style>
</head>
<body>

<!-- Pattern Lock Screen -->
<div id="lock-screen">
    <div class="lock-container">
        <div class="welcome-user-text">Welcome Back, John Lasper</div>
        <div class="lock-title" id="lock-prompt">Loading Security...</div>
        <div class="pattern-grid" id="pattern-grid">
            <svg id="pattern-svg">
                <line id="current-line" x1="0" y1="0" x2="0" y2="0" stroke="#059669" stroke-width="4" stroke-linecap="round" style="display:none;"/>
            </svg>
            <div class="pattern-dot" data-index="0"></div>
            <div class="pattern-dot" data-index="1"></div>
            <div class="pattern-dot" data-index="2"></div>
            <div class="pattern-dot" data-index="3"></div>
            <div class="pattern-dot" data-index="4"></div>
            <div class="pattern-dot" data-index="5"></div>
            <div class="pattern-dot" data-index="6"></div>
            <div class="pattern-dot" data-index="7"></div>
            <div class="pattern-dot" data-index="8"></div>
        </div>
        <div class="lock-error" id="lock-error"></div>
        <div class="pattern-actions">
            <button class="btn-action btn-secondary" onclick="resetPatternInput()">Clear</button>
        </div>
    </div>
</div>

<div class="app-container">
    <!-- App-Style Balance Card -->
    <div class="balance-card">
        <div class="balance-title">Total Available Funds</div>
        <div class="balance-amount" id="grand-total">0</div>
    </div>

    <!-- Accounts List -->
    <div class="accounts-list" id="rows-container"></div>
</div>

<div class="actions-area" style="margin-bottom: 10px;">
    <button class="btn-action" onclick="addRow()">+ Add Account</button>
    <button class="btn-action btn-secondary" onclick="undoDelete()" id="btn-undo" style="opacity: 0.5; pointer-events: none;">↩ Undo</button>
</div>
<div class="actions-area">
    <button class="btn-action btn-secondary" onclick="changePattern()">Change Pattern</button>
</div>

<!-- Firebase SDKs & App Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD4K17Q8r5-GDShRYRn4RU6Ki1mWbTHGew",
        authDomain: "funds-tracker-1609a.firebaseapp.com",
        databaseURL: "https://funds-tracker-1609a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "funds-tracker-1609a",
        storageBucket: "funds-tracker-1609a.firebasestorage.app",
        messagingSenderId: "646295926768",
        appId: "1:646295926768:web:6dd7984eff88e508d5cf35"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const fundsRef = ref(db, 'funds_data');
    const settingsRef = ref(db, 'app_settings');

    let defaultData = [
        { name: "Cash", amount: "2,320" },
        { name: "GCash", amount: "10,005" },
        { name: "MariBank", amount: "338,063" },
        { name: "Maya Business", amount: "40,294" },
        { name: "Janice", amount: "1,777" },
        { name: "Kim", amount: "2,000" },
        { name: "Cherry", amount: "5,890" }
    ];

    window.fundsData = [];
    let deletedItemCache = null; // Para sa Undo feature
    let saveTimeout = null;

    let cloudPattern = "";
    let selectedDots = [];
    let isDrawing = false;
    let confirmStepPattern = "";
    let isSettingMode = false;

    const lockScreen = document.getElementById('lock-screen');
    const lockPrompt = document.getElementById('lock-prompt');
    const grid = document.getElementById('pattern-grid');
    const dots = document.querySelectorAll('.pattern-dot');
    const svg = document.getElementById('pattern-svg');
    const currentLine = document.getElementById('current-line');

    onValue(settingsRef, (snapshot) => {
        const settings = snapshot.val();
        if (settings && settings.pattern) {
            cloudPattern = settings.pattern;
            if (!isSettingMode) {
                lockPrompt.innerText = "Draw Unlock Pattern";
            }
        } else {
            cloudPattern = "";
            lockPrompt.innerText = "Set Your New Pattern (Draw once)";
        }
    });

    function getDotCenter(dot) {
        const rect = dot.getBoundingClientRect();
        const gridRect = grid.getBoundingClientRect();
        return {
            x: rect.left + rect.width / 2 - gridRect.left,
            y: rect.top + rect.height / 2 - gridRect.top
        };
    }

    function redrawLines(sequence) {
        const oldLines = svg.querySelectorAll('.permanent-line');
        oldLines.forEach(l => l.remove());

        for (let i = 0; i < sequence.length - 1; i++) {
            let p1 = getDotCenter(dots[sequence[i]]);
            let p2 = getDotCenter(dots[sequence[i+1]]);
            let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', '#059669');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            line.classList.add('permanent-line');
            svg.appendChild(line);
        }
    }

    function startDraw(e) {
        isDrawing = true;
        selectedDots = [];
        document.getElementById('lock-error').innerText = "";
        dots.forEach(d => d.classList.remove('active'));
        currentLine.style.display = 'none';
        
        if (e.target && e.target.setPointerCapture && e.pointerId) {
            try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
        }
        
        checkTouch(e);
    }

    function moveDraw(e) {
        if (!isDrawing) return;
        checkTouch(e);
    }

    function endDraw(e) {
        if (!isDrawing) return;
        isDrawing = false;
        currentLine.style.display = 'none';

        if (e && e.target && e.target.releasePointerCapture && e.pointerId) {
            try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
        }

        if (selectedDots.length > 0) {
            handlePatternInput(selectedDots.join(','));
        }
    }

    function checkTouch(e) {
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);

        if (!clientX && !clientY) return;

        dots.forEach((dot, index) => {
            const rect = dot.getBoundingClientRect();
            const hitPadding = 26; 
            if (
                clientX >= rect.left - hitPadding && clientX <= rect.right + hitPadding &&
                clientY >= rect.top - hitPadding && clientY <= rect.bottom + hitPadding
            ) {
                if (!selectedDots.includes(index)) {
                    selectedDots.push(index);
                    dot.classList.add('active');
                    redrawLines(selectedDots);
                }
            }
        });

        if (selectedDots.length > 0) {
            const lastDot = dots[selectedDots[selectedDots.length - 1]];
            const p1 = getDotCenter(lastDot);
            const gridRect = grid.getBoundingClientRect();
            const x2 = clientX - gridRect.left;
            const y2 = clientY - gridRect.top;

            currentLine.setAttribute('x1', p1.x);
            currentLine.setAttribute('y1', p1.y);
            currentLine.setAttribute('x2', x2);
            currentLine.setAttribute('y2', y2);
            currentLine.style.display = 'block';
        }
    }

    grid.addEventListener('pointerdown', startDraw);
    grid.addEventListener('pointermove', moveDraw);
    grid.addEventListener('pointerup', endDraw);
    grid.addEventListener('pointercancel', endDraw);

    window.resetPatternInput = function() {
        selectedDots = [];
        dots.forEach(d => d.classList.remove('active'));
        const oldLines = svg.querySelectorAll('.permanent-line');
        oldLines.forEach(l => l.remove());
        currentLine.style.display = 'none';
    }

    function handlePatternInput(patternStr) {
        if (!cloudPattern || isSettingMode) {
            if (patternStr.split(',').length < 3) {
                document.getElementById('lock-error').innerText = "Connect at least 3 dots!";
                setTimeout(resetPatternInput, 600);
                return;
            }
            if (!confirmStepPattern) {
                confirmStepPattern = patternStr;
                lockPrompt.innerText = "Draw Pattern Again to Confirm";
                setTimeout(resetPatternInput, 400);
            } else {
                if (patternStr === confirmStepPattern) {
                    set(settingsRef, { pattern: confirmStepPattern }).then(() => {
                        alert("Pattern saved & synced to all devices!");
                        isSettingMode = false;
                        lockScreen.style.display = 'none';
                    });
                } else {
                    document.getElementById('lock-error').innerText = "Patterns do not match. Start over.";
                    confirmStepPattern = "";
                    lockPrompt.innerText = "Set Your New Pattern";
                }
                setTimeout(resetPatternInput, 600);
            }
        } else {
            if (patternStr === cloudPattern) {
                lockScreen.style.display = 'none';
            } else {
                document.getElementById('lock-error').innerText = "Incorrect pattern. Try again.";
                setTimeout(resetPatternInput, 600);
            }
        }
    }

    window.changePattern = function() {
        if (confirm("Do you want to change the unlock pattern for ALL devices?")) {
            isSettingMode = true;
            confirmStepPattern = "";
            lockPrompt.innerText = "Draw Your NEW Pattern";
            resetPatternInput();
            lockScreen.style.display = 'flex';
        }
    }

    onValue(fundsRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            let activeEl = document.activeElement;
            let isUserTyping = activeEl && (activeEl.classList.contains('input-name') || activeEl.classList.contains('input-amount'));

            if (JSON.stringify(data) !== JSON.stringify(window.fundsData)) {
                window.fundsData = data;
                localStorage.setItem('bankAppTracker_lighter_data', JSON.stringify(data));
                
                if (!isUserTyping) {
                    renderTable();
                } else {
                    calculateGrandTotal();
                }
            }
        } else {
            window.fundsData = defaultData;
            set(fundsRef, defaultData);
            renderTable();
        }
    });

    window.scheduleCloudSync = function() {
        localStorage.setItem('bankAppTracker_lighter_data', JSON.stringify(window.fundsData));
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            set(fundsRef, window.fundsData).catch((error) => {
                console.error("Error sa pag-sync:", error);
            });
        }, 300);
    }

    window.formatNumber = function(num) {
        return num.toLocaleString();
    }

    window.parseNum = function(val) {
        if (!val) return 0;
        let clean = val.toString().replace(/,/g, '');
        let parsed = parseFloat(clean);
        return isNaN(parsed) ? 0 : parsed;
    }

    window.getBrandInfo = function(name) {
        if (!name) return { color: '#475569', bg: 'linear-gradient(90deg, rgba(71, 85, 105, 0.18) 0%, rgba(17, 24, 39, 0.9) 80%)', icon: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>` };
        let lower = name.toLowerCase().trim();
        
        if (lower.includes('gcash')) {
            return {
                color: '#0099ff',
                bg: 'linear-gradient(90deg, rgba(0, 153, 255, 0.28) 0%, rgba(17, 24, 39, 0.9) 80%)',
                icon: `<svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>`
            };
        } else if (lower.includes('maribank')) {
            return {
                color: '#fb923c',
                bg: 'linear-gradient(90deg, rgba(251, 146, 60, 0.28) 0%, rgba(17, 24, 39, 0.9) 80%)',
                icon: `<svg viewBox="0 0 24 24"><path d="M11.5 1L2 6v2h19V6m-9.5 4c-3.87 0-7 3.13-7 7s3.13 7 7 7 7-3.13 7-7-3.13-7-7-7m0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>`
            };
        } else if (lower.includes('maya')) {
            return {
                color: '#22d3ee',
                bg: 'linear-gradient(90deg, rgba(34, 211, 238, 0.28) 0%, rgba(17, 24, 39, 0.9) 80%)',
                icon: `<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>`
            };
        } else if (lower.includes('cash')) {
            return {
                color: '#34d399',
                bg: 'linear-gradient(90deg, rgba(52, 211, 153, 0.28) 0%, rgba(17, 24, 39, 0.9) 80%)',
                icon: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.64 0-.83-.41-1.64-2.92-2.23-3.22-.75-4.42-1.83-4.42-3.5 0-1.64 1.32-2.86 3.12-3.21V4h2.67v1.95c1.4.31 2.7 1.25 2.92 3.01h-1.97c-.12-.8-.71-1.41-2.13-1.41-1.35 0-2.05.59-2.05 1.44 0 .75.48 1.32 2.62 1.83 3.39.81 4.72 1.83 4.72 3.65 0 1.73-1.3 2.96-3.23 3.34z"/></svg>`
            };
        } else {
            return {
                color: '#94a3b8',
                bg: 'linear-gradient(90deg, rgba(148, 163, 184, 0.2) 0%, rgba(17, 24, 39, 0.9) 80%)',
                icon: `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`
            };
        }
    }

    window.renderTable = function() {
        let container = document.getElementById('rows-container');
        container.innerHTML = '';

        window.fundsData.forEach((item, index) => {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'row-item';

            let brand = getBrandInfo(item.name);
            rowDiv.style.background = brand.bg;

            let lowerName = item.name ? item.name.toLowerCase().trim() : "";
            let isProtected = lowerName === 'cash' || lowerName === 'gcash' || lowerName === 'maribank' || lowerName === 'maya business';

            rowDiv.innerHTML = `
                <div class="name-input-wrapper" id="wrapper-${index}" style="border-left-color: ${brand.color};">
                    <div class="brand-icon" id="icon-${index}" style="fill: ${brand.color};">${brand.icon}</div>
                    <input type="text" class="input-name" value="${item.name || ''}" placeholder="Account name..." oninput="updateItemName(${index}, this)">
                </div>
                <input type="text" class="input-amount" value="${item.amount || ''}" placeholder="0" 
                    onfocus="handleAmountFocus(this)" 
                    oninput="handleAmountInput(${index}, this)" 
                    onblur="formatAmountBlur(${index}, this)">
                ${isProtected ? `<div style="width: 32px;"></div>` : `<button class="btn-delete-row" onclick="deleteRow(${index})" title="Delete account">×</button>`}
            `;
            container.appendChild(rowDiv);
        });

        calculateGrandTotal();
    }

    // Inig click/focus sa amount, awtomatikong ma-select ang tibuok numero para dali mailisan
    window.handleAmountFocus = function(inputEl) {
        setTimeout(() => {
            inputEl.select();
        }, 50);
        let raw = inputEl.value.replace(/,/g, '');
        if (raw !== "0") {
            inputEl.value = raw;
        }
    }

    window.updateItemName = function(index, inputEl) {
        window.fundsData[index]['name'] = inputEl.value;
        let brand = getBrandInfo(inputEl.value);
        
        let rowEl = inputEl.closest('.row-item');
        let wrapper = document.getElementById(`wrapper-${index}`);
        let icon = document.getElementById(`icon-${index}`);
        
        if(rowEl) rowEl.style.background = brand.bg;
        if(wrapper) wrapper.style.borderLeftColor = brand.color;
        if(icon) {
            icon.style.fill = brand.color;
            icon.innerHTML = brand.icon;
        }

        scheduleCloudSync();
    }

    window.handleAmountInput = function(index, inputEl) {
        window.fundsData[index]['amount'] = inputEl.value;
        calculateGrandTotal();
        scheduleCloudSync();
    }

    window.formatAmountBlur = function(index, inputEl) {
        let rawVal = inputEl.value.trim();
        if (rawVal !== "") {
            let num = parseNum(rawVal);
            if (num > 0 || rawVal === "0") {
                inputEl.value = formatNumber(num);
                window.fundsData[index]['amount'] = inputEl.value;
                scheduleCloudSync();
            }
        }
        calculateGrandTotal();
    }

    window.calculateGrandTotal = function() {
        let total = 0;
        window.fundsData.forEach(item => {
            total += parseNum(item.amount);
        });
        document.getElementById('grand-total').innerText = formatNumber(total);
    }

    window.addRow = function() {
        window.fundsData.push({ name: "", amount: "" });
        scheduleCloudSync();
        renderTable();
    }

    window.deleteRow = function(index) {
        let removed = window.fundsData.splice(index, 1)[0];
        deletedItemCache = removed; // I-save sa cache para ma-undo
        
        let undoBtn = document.getElementById('btn-undo');
        if(undoBtn) {
            undoBtn.style.opacity = '1';
            undoBtn.style.pointerEvents = 'auto';
        }

        scheduleCloudSync();
        renderTable();
    }

    window.undoDelete = function() {
        if (deletedItemCache) {
            window.fundsData.push(deletedItemCache);
            deletedItemCache = null;
            
            let undoBtn = document.getElementById('btn-undo');
            if(undoBtn) {
                undoBtn.style.opacity = '0.5';
                undoBtn.style.pointerEvents = 'none';
            }

            scheduleCloudSync();
            renderTable();
        }
    }
</script>

</body>
</html>
