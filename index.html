<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>GCash Tracker Dashboard</title>
    <!-- Google Font: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 1200px;
        }
        .container {
            width: 1180px;
            margin: 0 auto;
            padding: 0 5px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #333;
            width: 100%;
        }
        .top-header h1 {
            font-size: 15px;
            color: #fbbf24;
        }
        .grand-total-container {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            background: #111827;
            padding: 8px 18px;
            border-radius: 4px;
            border: 1px solid #143322;
        }
        .grand-total-container span {
            color: #4ade80;
            font-size: 22px;
            margin-left: 8px;
            font-weight: 700;
        }
        .header-btns {
            display: flex;
            gap: 10px;
        }
        .btn-action {
            background: #143322;
            color: white;
            border: 1px solid #1f4e34;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }
        .btn-action:hover { background: #1f4e34; }

        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
        }
        .pair-row {
            display: flex;
            gap: 25px;
            justify-content: center;
            width: 100%;
        }
        .card {
            background: #0d1b2a;
            border: 2px solid #143322;
            border-radius: 4px;
            overflow: visible;
            position: relative;
            width: 540px;
            flex-shrink: 0;
        }
        .placeholder {
            width: 540px;
            display: block;
            flex-shrink: 0;
        }

        .table-headers {
            display: grid;
            grid-template-columns: 30px 25fr 30fr 30fr 15fr;
            background: #111827;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            border-bottom: 2px solid #143322;
            align-items: center;
        }
        .table-headers div {
            padding: 6px 2px;
            border-right: 1px solid #1f2937;
        }
        .col-arrow-header {
            background: #0f2618;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-size: 15px;
            user-select: none;
            height: 100%;
        }
        .col-arrow-header:hover {
            background: #143322;
            color: #ffffff;
        }

        .table-headers div:nth-child(2) { color: #ffffff; }
        .table-headers div:nth-child(3) { color: #ffffff; }
        .table-headers div:nth-child(4) { color: #ffffff; }
        .table-headers div:nth-child(4) span { color: #4ade80; }
        .table-headers div:nth-child(5) { color: #fb923c; border-right: none; }

        .card-body {
            display: grid;
            grid-template-columns: 25fr 30fr 30fr 15fr;
        }
        .col-gcash, .col-site, .col-withdraw, .col-send {
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .col-gcash {
            background: #1d3557;
            border-right: 1px solid #111827;
        }
        .col-site {
            background: #273449;
            border-right: 1px solid #111827;
            position: relative;
        }
        .col-withdraw {
            background: #163821;
            border-right: 1px solid #111827;
        }
        .col-send {
            background: #3b2413;
            align-items: center;
            justify-content: flex-start;
        }

        .row-input {
            width: 100%;
            height: 26px;
            background: #1e293b;
            border: 1px solid #143322;
            color: #e5e7eb;
            font-size: 16px;
            text-align: center;
            border-radius: 2px;
            outline: none;
            font-weight: 400;
        }
        .row-input:focus {
            border-color: #22c55e;
            background: #0f172a;
        }
        
        .col-gcash .row-input {
            color: #fbbf24;
            font-size: 16px;
            font-weight: 400;
        }
        .col-site .row-input {
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid #22c55e;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f172a;
            max-height: 150px;
            overflow-y: auto;
        }
        .autocomplete-items div {
            padding: 6px;
            cursor: pointer;
            background-color: #1e293b;
            border-bottom: 1px solid #143322;
            font-size: 14px;
            color: #ffffff;
            text-align: center;
        }
        .autocomplete-items div:hover {
            background-color: #143322;
            color: #ffffff;
        }

        .withdraw-wrapper {
            position: relative;
            width: 100%;
            height: 26px;
            background: #102617;
            border: 1px solid #22543d;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .withdraw-wrapper:focus-within {
            border-color: #22c55e;
            background: #0f172a;
        }
        .withdraw-input {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            text-align: center;
            color: transparent;
            caret-color: #ffffff;
            z-index: 2;
            font-weight: 400;
        }
        .withdraw-display {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            pointer-events: none;
            z-index: 1;
            white-space: pre;
            font-weight: 400;
        }
        .part-left { color: #ffffff; font-weight: 400; }
        .part-right { color: #4ade80; font-weight: 400; }
        .part-minus { color: #f97316; font-weight: 700; margin-left: 4px; }

        .row-minus-popover {
            display: none;
            position: absolute;
            right: -68px;
            top: 0;
            height: 26px;
            z-index: 50;
            gap: 2px;
        }
        .popover-btn-minus {
            width: 30px;
            height: 26px;
            background: #b45309;
            color: #fef3c7;
            border: none;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popover-btn-minus:hover { background: #d97706; color: white; }

        .popover-btn-undo {
            width: 34px;
            height: 26px;
            background: #143322;
            color: #86efac;
            border: none;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popover-btn-undo:hover { background: #1f4e34; color: white; }
        
        .send-value {
            width: 100%;
            height: 26px;
            color: #fb923c;
            font-weight: 400;
            font-size: 16px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-footer {
            display: grid;
            grid-template-columns: 110px 1fr 75px 75px;
            background: #111827;
            border-top: 2px solid #143322;
            align-items: stretch;
        }
        .title-btn {
            background: #143322;
            color: white;
            border: none;
            padding: 8px 4px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            border-right: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title-btn:hover { background: #1f4e34; }

        .stats-box {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 2px;
            border-right: 1px solid #1f2937;
        }
        
        .stat-limit, .stat-pay {
            font-size: 16px;
            font-weight: 700;
        }
        .stat-limit { text-align: center; color: #e5e7eb; }
        
        .stat-total-val { font-size: 18px; color: #38bdf8; font-weight: 700; }
        .stat-limit-val { font-size: 18px; color: #ef4444; font-weight: 700; }

        .stat-pay { text-align: center; color: #ffffff; }
        .stat-pay span { font-size: 15px; color: #4ade80; font-weight: 700; }

        .btn-reset {
            background: #991b1b;
            color: #fee2e2;
            border: none;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            padding: 8px 2px;
            border-right: 1px solid #1f2937;
        }
        .btn-reset:hover { background: #b91c1c; color: white; }

        .btn-delete {
            background: #581c87;
            color: #e9d5ff;
            border: none;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            padding: 8px 2px;
        }
        .btn-delete:hover { background: #6b21a8; color: white; }

        .add-section {
            display: flex;
            justify-content: center;
            margin: 25px 0;
            width: 100%;
        }
        .btn-add-table {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-add-table:hover { background: #047857; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #143322;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #22543d;
        }
        .modal-content h3 { font-size: 16px; margin-bottom: 5px; color: #fbbf24; text-align: center; font-weight: 700; }
        .modal-option {
            background: #0f2618;
            color: white;
            border: 1px solid #22543d;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 18px;
            text-align: center;
        }
        .modal-option:hover { background: #1f4e34; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <h1>GCash Tracker Dashboard</h1>
        <div class="grand-total-container">
            GRAND TOTAL: <span id="grand-total-val">0</span>
        </div>
        <div class="header-btns">
            <button class="btn-action" onclick="exportData()">Export Backup</button>
        </div>
    </div>

    <div class="dashboard-grid" id="tables-container"></div>

    <div class="add-section">
        <button class="btn-add-table" onclick="addTablePair()">
            <span>Add Table Pair</span> 
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
</div>

<div class="modal" id="categoryModal">
    <div class="modal-content">
        <h3>SELECT PHONES</h3>
        <button class="modal-option" onclick="selectCategory('NUBIA')">NUBIA</button>
        <button class="modal-option" onclick="selectCategory('RM')">RM</button>
        <button class="modal-option" onclick="selectCategory('VIVO')">VIVO</button>
        <button class="modal-option" onclick="selectCategory('7PRO')">7PRO</button>
        <button class="modal-option" onclick="selectCategory('NOTE')">NOTE</button>
        <button class="modal-option" onclick="selectCategory('MUSIC')">MUSIC</button>
        <button class="modal-option" style="background:#0f2618; margin-top:5px; font-size: 16px;" onclick="closeModal()">Close</button>
    </div>
</div>

<!-- Firebase Scripts & Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyChbH-K3pEmcmMyv09dyixFyx0t9kQJPTk",
        authDomain: "gcash-tracker-91a99.firebaseapp.com",
        databaseURL: "https://gcash-tracker-91a99-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "gcash-tracker-91a99",
        storageBucket: "gcash-tracker-91a99.appspot.com",
        messagingSenderId: "440088070678",
        appId: "1:440088070678:web:9a2409808b856c6309c337",
        measurementId: "G-9V01ZKYW9X"
    };

    let tablePairs = [];
    const maxRows = 14;
    let activePairIndex = null;
    let isCreatingNew = false;

    const siteList = [
        "778go", "k67", "PHB", "t988", "j77", "qpjl", "ttjl", "OKT", "888pinas", "jlwafa", 
        "bingomax", "567jl", "ufo", "tayahot", "tara", "63slots", "pinasdiamond", "kubra", 
        "pharcade", "paldocrown", "akaok", "pk11", "philslot", "bpanthers", "bet160", "358jl", 
        "goodjl", "828jl", "scarabph", "megawagi", "alligator", "jliso", "easyearn", "2djili", 
        "tablegame+", "durian", "boss7", "bonanza", "pinoy", "malupetph", "FBM", "PH888", 
        "5djl", "Paldogrown", "D9", "sarimanok", "gogoph", "3u3u", "winpinas", "luckace", 
        "sinswerte", "moonpinas", "leopard", "jilicasino", "panalolagi", "boompanalo", "SR93", 
        "gamepinas", "racoon", "200SR"
    ];

    function formatNumber(num) {
        return num.toLocaleString();
    }

    function getDefaultStructure() {
        return [
            {
                category: "RM",
                leftVisible: true, rightVisible: true,
                leftCollapsed: false, rightCollapsed: false,
                left: { gcash: Array(14).fill(""), sites: Array(14).fill(""), withdraws: Array(14).fill(""), manualPayDeductions: Array(14).fill(0) },
                right: { gcash: Array(14).fill(""), sites: Array(14).fill(""), withdraws: Array(14).fill(""), manualPayDeductions: Array(14).fill(0) }
            },
            {
                category: "NUBIA",
                leftVisible: true, rightVisible: true,
                leftCollapsed: false, rightCollapsed: false,
                left: { gcash: Array(14).fill(""), sites: Array(14).fill(""), withdraws: Array(14).fill(""), manualPayDeductions: Array(14).fill(0) },
                right: { gcash: Array(14).fill(""), sites: Array(14).fill(""), withdraws: Array(14).fill(""), manualPayDeductions: Array(14).fill(0) }
            }
        ];
    }

    // 1. Siguraduha nga mo-load dayon gikan sa LocalStorage aron dili ma-blanko samtang naghulat sa Firebase
    const localData = localStorage.getItem('gcashTracker_data');
    if (localData) {
        try {
            tablePairs = JSON.parse(localData);
            renderDashboard();
        } catch(e) {
            console.error("Local storage error:", e);
        }
    }

    if (tablePairs.length === 0) {
        tablePairs = getDefaultStructure();
        renderDashboard();
    }

    // 2. Sulayi pagkonekta sa Firebase kung pwede
    try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'gcashTracker/data');

        onValue(dbRef, (snapshot) => {
            const serverData = snapshot.val();
            if (serverData && serverData.length > 0) {
                tablePairs = serverData;
                tablePairs.forEach(pair => {
                    if (pair.leftCollapsed === undefined) pair.leftCollapsed = false;
                    if (pair.rightCollapsed === undefined) pair.rightCollapsed = false;
                    ['left', 'right'].forEach(side => {
                        if (!pair[side].gcash) pair[side].gcash = Array(14).fill("");
                        if (!pair[side].sites) pair[side].sites = Array(14).fill("");
                        if (!pair[side].withdraws) pair[side].withdraws = Array(14).fill("");
                        if (!pair[side].manualPayDeductions) {
                            let oldVal = pair[side].manualPayDeduction || 0;
                            pair[side].manualPayDeductions = Array(14).fill(0);
                            if (oldVal > 0 && pair[side].withdraws.length > 0) {
                                pair[side].manualPayDeductions[0] = oldVal;
                            }
                        }
                    });
                });
                localStorage.setItem('gcashTracker_data', JSON.stringify(tablePairs));
                renderDashboard();
            }
        }, (error) => {
            console.error("Firebase connection error (Nag-offline mode):", error);
        });

        window.saveToDataStore = function() {
            localStorage.setItem('gcashTracker_data', JSON.stringify(tablePairs));
            set(dbRef, tablePairs).catch((error) => {
                console.error("Error saving to Firebase: ", error);
            });
        }
    } catch (err) {
        console.error("Firebase init failed, running local storage only:", err);
        window.saveToDataStore = function() {
            localStorage.setItem('gcashTracker_data', JSON.stringify(tablePairs));
        }
    }

    function renderDashboard() {
        let container = document.getElementById('tables-container');
        if (!container) return;
        container.innerHTML = '';

        tablePairs.forEach((pair, pairIdx) => {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'pair-row';

            if (pair.leftVisible) {
                rowDiv.appendChild(createCardElement(pair, pairIdx, 'left'));
            } else {
                let placeholder = document.createElement('div');
                placeholder.className = 'placeholder';
                rowDiv.appendChild(placeholder);
            }

            if (pair.rightVisible) {
                rowDiv.appendChild(createCardElement(pair, pairIdx, 'right'));
            } else {
                let placeholder = document.createElement('div');
                placeholder.className = 'placeholder';
                rowDiv.appendChild(placeholder);
            }

            container.appendChild(rowDiv);
        });

        calculateGrandTotal();
    }

    function createCardElement(pairObj, pairIdx, side) {
        let card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${pairIdx}-${side}`;
        
        let tableObj = pairObj[side];
        let displayTitle = side === 'left' ? `${pairObj.category || 'SELECT'} MAIN` : `${pairObj.category || 'SELECT'} WORK`;
        let isCollapsed = side === 'left' ? pairObj.leftCollapsed : pairObj.rightCollapsed;
        let arrowSymbol = isCollapsed ? '▶' : '▼';

        let gcashHTML = '';
        let sitesHTML = '';
        let withdrawsHTML = '';
        let sendsHTML = '';

        for (let r = 0; r < maxRows; r++) {
            let gVal = tableObj.gcash && tableObj.gcash[r] !== undefined ? tableObj.gcash[r] : '';
            let siteVal = tableObj.sites && tableObj.sites[r] !== undefined ? tableObj.sites[r] : '';
            let wVal = tableObj.withdraws && tableObj.withdraws[r] !== undefined ? tableObj.withdraws[r] : '';
            let mDeduction = tableObj.manualPayDeductions && tableObj.manualPayDeductions[r] ? tableObj.manualPayDeductions[r] : 0;
            
            gcashHTML += `<input type="text" class="row-input gcash-input" value="${gVal}" onfocus="this.select()" oninput="updateData(${pairIdx}, '${side}')">`;
            
            sitesHTML += `
                <div style="position:relative; width:100%;">
                    <input type="text" class="row-input site-input" value="${siteVal}" onfocus="this.select()" oninput="handleSiteInput(event, ${pairIdx}, '${side}', ${r})" onkeydown="handleSiteKey(event, ${pairIdx}, '${side}', ${r})" autocomplete="off">
                    <div id="autocomplete-list-${pairIdx}-${side}-${r}" class="autocomplete-items"></div>
                </div>
            `;
            
            let displayFormatted = formatWithdrawDisplay(wVal, mDeduction);
            withdrawsHTML += `
                <div class="withdraw-wrapper" onclick="toggleRowMinus(${pairIdx}, '${side}', ${r}, event)">
                    <div class="withdraw-display" id="display-${pairIdx}-${side}-${r}">${displayFormatted}</div>
                    <input type="text" class="withdraw-input" value="${wVal}" onfocus="this.select()" oninput="handleWithdrawInput(${pairIdx}, '${side}', ${r}, this)" onblur="normalizeWithdraw(${pairIdx}, '${side}', ${r}, this)">
                    <div class="row-minus-popover" id="popover-minus-${pairIdx}-${side}-${r}">
                        <button class="popover-btn-minus" onclick="applyRowAdjustment(event, ${pairIdx}, '${side}', ${r}, 5)" title="Minus 5">-5</button>
                        <button class="popover-btn-undo" onclick="applyRowAdjustment(event, ${pairIdx}, '${side}', ${r}, -5)" title="Undo 5">+5</button>
                    </div>
                </div>
            `;
            
            sendsHTML += `<div class="send-value" id="send-${pairIdx}-${side}-${r}">0</div>`;
        }

        let bodyStyle = isCollapsed ? 'display: none;' : 'display: grid;';
        let footerStyle = isCollapsed ? 'display: none;' : 'display: grid;';

        card.innerHTML = `
            <div class="table-headers">
                <div class="col-arrow-header" onclick="toggleCollapse(${pairIdx}, '${side}')" title="Collapse / Expand">${arrowSymbol}</div>
                <div>Gcash</div>
                <div>Site</div>
                <div>Withdraw<span> / PAY</span></div>
                <div>SEND</div>
            </div>
            <div class="card-body" id="body-${pairIdx}-${side}" style="${bodyStyle}">
                <div class="col-gcash">${gcashHTML}</div>
                <div class="col-site">${sitesHTML}</div>
                <div class="col-withdraw">${withdrawsHTML}</div>
                <div class="col-send">${sendsHTML}</div>
            </div>
            <div class="card-footer" id="footer-${pairIdx}-${side}" style="${footerStyle}">
                <button class="title-btn" onclick="openModal(${pairIdx})">${displayTitle}</button>
                <div class="stats-box">
                    <div class="stat-limit">TOTAL / LIMIT<br><span id="tot-limit-${pairIdx}-${side}"><span class="stat-total-val" id="tot-val-${pairIdx}-${side}">0</span> / <span class="stat-limit-val" id="lim-val-${pairIdx}-${side}">5,000</span></span></div>
                    <div class="stat-pay">TOTAL PAY<br><span id="tot-pay-${pairIdx}-${side}">0</span></div>
                </div>
                <button class="btn-reset" onclick="resetTable(${pairIdx}, '${side}')">RESET</button>
                <button class="btn-delete" onclick="deleteTable(${pairIdx}, '${side}')">DELETE</button>
            </div>
        `;
        
        setTimeout(() => calculateCard(pairIdx, side), 0);
        return card;
    }

    window.toggleRowMinus = function(pairIdx, side, rowIndex, event) {
        document.querySelectorAll('.row-minus-popover').forEach(el => el.style.display = 'none');
        let popover = document.getElementById(`popover-minus-${pairIdx}-${side}-${rowIndex}`);
        if (popover) {
            popover.style.display = 'flex';
            event.stopPropagation();
        }
    }

    document.addEventListener("click", function(e) {
        if (!e.target.closest('.withdraw-wrapper') && !e.target.closest('.row-minus-popover')) {
            document.querySelectorAll('.row-minus-popover').forEach(el => el.style.display = 'none');
        }
    });

    window.applyRowAdjustment = function(event, pairIdx, side, rowIndex, amount) {
        event.stopPropagation();
        if (!tablePairs[pairIdx][side].manualPayDeductions) {
            tablePairs[pairIdx][side].manualPayDeductions = Array(14).fill(0);
        }
        
        let currentDeduction = tablePairs[pairIdx][side].manualPayDeductions[rowIndex] || 0;
        let newDeduction = currentDeduction + amount;
        if (newDeduction < 0) newDeduction = 0;

        tablePairs[pairIdx][side].manualPayDeductions[rowIndex] = newDeduction;
        
        if (typeof saveToDataStore === 'function') saveToDataStore();
        
        let card = document.getElementById(`card-${pairIdx}-${side}`);
        let wInp = card.querySelectorAll('.withdraw-input')[rowIndex];
        let displayEl = document.getElementById(`display-${pairIdx}-${side}-${rowIndex}`);
        if (displayEl) {
            displayEl.innerHTML = formatWithdrawDisplay(wInp.value, newDeduction);
        }

        calculateCard(pairIdx, side);
        calculateGrandTotal();
        document.querySelectorAll('.row-minus-popover').forEach(el => el.style.display = 'none');
    }

    window.resetTable = function(pairIdx, side) {
        if (confirm("Sigurado ka ba nga i-reset kining tableha?")) {
            tablePairs[pairIdx][side] = {
                gcash: Array(14).fill(""),
                sites: Array(14).fill(""),
                withdraws: Array(14).fill(""),
                manualPayDeductions: Array(14).fill(0)
            };
            if (typeof saveToDataStore === 'function') saveToDataStore();
            renderDashboard();
        }
    }

    window.toggleCollapse = function(pairIdx, side) {
        if (side === 'left') {
            tablePairs[pairIdx].leftCollapsed = !tablePairs[pairIdx].leftCollapsed;
        } else {
            tablePairs[pairIdx].rightCollapsed = !tablePairs[pairIdx].rightCollapsed;
        }
        if (typeof saveToDataStore === 'function') saveToDataStore();
        renderDashboard();
    }

    function formatWithdrawDisplay(val, mDeduction = 0) {
        if (!val && mDeduction === 0) return '';
        let parts = (val || "").split('/');
        let left = parts[0] !== undefined ? parts[0].trim() : '';
        let right = parts[1] !== undefined ? parts[1].trim() : '';
        
        let leftFormatted = !isNaN(left) && left !== '' ? formatNumber(parseFloat(left)) : left;
        let rightFormatted = !isNaN(right) && right !== '' ? formatNumber(parseFloat(right)) : right;

        let html = `<span class="part-left">${leftFormatted} / </span>`;
        if (right !== '' || left !== '') {
            html += `<span class="part-right">${rightFormatted}</span>`;
        }
        if (mDeduction > 0) {
            html += `<span class="part-minus">-${mDeduction}</span>`;
        }
        return html;
    }

    window.handleWithdrawInput = function(pairIdx, side, rowIndex, inputEl) {
        let val = inputEl.value;
        let mDeduction = tablePairs[pairIdx][side].manualPayDeductions ? (tablePairs[pairIdx][side].manualPayDeductions[rowIndex] || 0) : 0;
        let displayEl = document.getElementById(`display-${pairIdx}-${side}-${rowIndex}`);
        if (displayEl) {
            displayEl.innerHTML = formatWithdrawDisplay(val, mDeduction);
        }
        updateData(pairIdx, side);
    }

    window.normalizeWithdraw = function(pairIdx, side, rowIndex, inputEl) {
        let val = inputEl.value.trim();
        if (val.includes('/')) {
            let parts = val.split('/');
            let p1 = parts[0].trim();
            let p2 = parts[1].trim();
            if (p2 !== '') {
                inputEl.value = `${p1} / ${p2}`;
            } else {
                inputEl.value = `${p1} / `;
            }
        }
        let mDeduction = tablePairs[pairIdx][side].manualPayDeductions ? (tablePairs[pairIdx][side].manualPayDeductions[rowIndex] || 0) : 0;
        let displayEl = document.getElementById(`display-${pairIdx}-${side}-${rowIndex}`);
        if (displayEl) {
            displayEl.innerHTML = formatWithdrawDisplay(inputEl.value, mDeduction);
        }
        updateData(pairIdx, side);
    }

    window.handleSiteInput = function(event, pairIdx, side, rowIndex) {
        let inputEl = event.target;
        let val = inputEl.value;
        let listContainer = document.getElementById(`autocomplete-list-${pairIdx}-${side}-${rowIndex}`);
        
        listContainer.innerHTML = "";
        if (!val) {
            updateData(pairIdx, side);
            return;
        }

        let valLower = val.toLowerCase();
        let matches = siteList.filter(site => site.toLowerCase().includes(valLower));

        matches.forEach(matchText => {
            let item = document.createElement("div");
            item.innerHTML = matchText;
            item.onclick = function() {
                inputEl.value = matchText;
                listContainer.innerHTML = "";
                updateData(pairIdx, side);
            };
            listContainer.appendChild(item);
        });

        updateData(pairIdx, side);
    }

    document.addEventListener("click", function (e) {
        if (!e.target.classList.contains('site-input')) {
            document.querySelectorAll('.autocomplete-items').forEach(el => el.innerHTML = '');
        }
    });

    window.handleSiteKey = function(event, pairIdx, side, rowIndex) {
        if (event.key === 'Enter') {
            event.preventDefault();
            let card = document.getElementById(`card-${pairIdx}-${side}`);
            let siteInput = card.querySelectorAll('.site-input')[rowIndex];
            let withdrawInput = card.querySelectorAll('.withdraw-input')[rowIndex];
            let listContainer = document.getElementById(`autocomplete-list-${pairIdx}-${side}-${rowIndex}`);
            if (listContainer) listContainer.innerHTML = "";

            let val = siteInput.value;

            let match = val.match(/(.+?)\s+(\d+)[-\/,\s](\d+)/);
            if (match) {
                let siteName = match[1].trim();
                let num1 = match[2];
                let num2 = match[3];

                siteInput.value = siteName;
                withdrawInput.value = `${num1} / ${num2}`;
                
                let mDeduction = tablePairs[pairIdx][side].manualPayDeductions ? (tablePairs[pairIdx][side].manualPayDeductions[rowIndex] || 0) : 0;
                let displayEl = document.getElementById(`display-${pairIdx}-${side}-${rowIndex}`);
                if (displayEl) displayEl.innerHTML = formatWithdrawDisplay(withdrawInput.value, mDeduction);
            }

            updateData(pairIdx, side);

            let nextSiteInput = card.querySelectorAll('.site-input')[rowIndex + 1];
            if (nextSiteInput) {
                nextSiteInput.focus();
                nextSiteInput.select();
            }
        }
    }

    window.addTablePair = function() {
        tablePairs.push({
            category: "",
            leftVisible: true, rightVisible: true,
            leftCollapsed: false, rightCollapsed: false,
            left: { gcash: Array(14).fill(""), sites: Array(14).fill(""), withdraws: Array(14).fill(""), manualPayDeductions: Array(14).fill(0) },
            right: { gcash: Array(14).fill(""), sites: Array(14).fill(""), withdraws: Array(14).fill(""), manualPayDeductions: Array(14).fill(0) }
        });
        
        openModal(tablePairs.length - 1);
    }

    window.deleteTable = function(pairIdx, side) {
        if (confirm("Sigurado ka ba nga i-delete kining tableha?")) {
            tablePairs[pairIdx][side + 'Visible'] = false;
            if (!tablePairs[pairIdx].leftVisible && !tablePairs[pairIdx].rightVisible) {
                tablePairs.splice(pairIdx, 1);
            }
            if (typeof saveToDataStore === 'function') saveToDataStore();
            renderDashboard();
        }
    }

    window.openModal = function(pairIdx) {
        activePairIndex = pairIdx;
        document.getElementById('categoryModal').style.display = 'flex';
    }

    window.closeModal = function() {
        document.getElementById('categoryModal').style.display = 'none';
        renderDashboard();
    }

    window.selectCategory = function(categoryName) {
        if (activePairIndex !== null) {
            tablePairs[activePairIndex].category = categoryName;
            closeModal();
            if (typeof saveToDataStore === 'function') saveToDataStore();
            renderDashboard();
        }
    }

    let saveTimeout = null;
    window.updateData = function(pairIdx, side) {
        let card = document.getElementById(`card-${pairIdx}-${side}`);
        if (!card) return;

        let gcashVals = [];
        let sites = [];
        let withdraws = [];
        
        card.querySelectorAll('.gcash-input').forEach(inp => gcashVals.push(inp.value));
        card.querySelectorAll('.site-input').forEach(inp => sites.push(inp.value));
        card.querySelectorAll('.withdraw-input').forEach(inp => withdraws.push(inp.value));

        tablePairs[pairIdx][side].gcash = gcashVals;
        tablePairs[pairIdx][side].sites = sites;
        tablePairs[pairIdx][side].withdraws = withdraws;

        calculateCard(pairIdx, side);
        calculateGrandTotal();

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            if (typeof saveToDataStore === 'function') saveToDataStore();
        }, 500);
    }

    function calculateCard(pairIdx, side) {
        let card = document.getElementById(`card-${pairIdx}-${side}`);
        let totalWithdraw = 0;
        let totalPay = 0;

        let pair = tablePairs[pairIdx];
        let mDeductions = pair && pair[side] && pair[side].manualPayDeductions ? pair[side].manualPayDeductions : Array(14).fill(0);

        if (card) {
            let withdrawInputs = card.querySelectorAll('.withdraw-input');
            withdrawInputs.forEach((inp, r) => {
                let parts = inp.value.split('/');
                let w = parseFloat(parts[0]) || 0;
                let p = parseFloat(parts[1]) || 0;
                let mD = mDeductions[r] || 0;
                let effectiveP = p - mD;
                if (effectiveP < 0) effectiveP = 0;

                let sendEl = document.getElementById(`send-${pairIdx}-${side}-${r}`);
                let standardSend = w - p; 
                if (sendEl) sendEl.innerText = formatNumber(standardSend);
                
                totalWithdraw += w;
                totalPay += effectiveP;
            });
        }

        let remainingLimit = 5000 - totalWithdraw;

        let totValEl = document.getElementById(`tot-val-${pairIdx}-${side}`);
        let limValEl = document.getElementById(`lim-val-${pairIdx}-${side}`);
        let totPayEl = document.getElementById(`tot-pay-${pairIdx}-${side}`);

        if (totValEl) totValEl.innerText = formatNumber(totalWithdraw);
        if (limValEl) limValEl.innerText = formatNumber(remainingLimit);
        if (totPayEl) totPayEl.innerText = formatNumber(totalPay);
    }

    function calculateGrandTotal() {
        let grandTotalPay = 0;
        tablePairs.forEach((pair, pairIdx) => {
            ['left', 'right'].forEach(side => {
                if (pair[side + 'Visible'] && pair[side] && pair[side].withdraws) {
                    let mDeductions = pair[side].manualPayDeductions || Array(14).fill(0);
                    pair[side].withdraws.forEach((wVal, r) => {
                        let parts = (wVal || "").split('/');
                        let p = parseFloat(parts[1]) || 0;
                        let mD = mDeductions[r] || 0;
                        let effectiveP = p - mD;
                        if (effectiveP < 0) effectiveP = 0;
                        grandTotalPay += effectiveP;
                    });
                }
            });
        });
        let grandEl = document.getElementById('grand-total-val');
        if (grandEl) grandEl.innerText = formatNumber(grandTotalPay);
    }
</script>

</body>
